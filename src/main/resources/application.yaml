spring:
  application:
    name: discovery
  threads:
    virtual:
      enabled: true
server:
  port: 8761
eureka:
  instance:
    hostname: discovery
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://discovery:8761/eureka/
logging:
  level:
    com.netflix.eureka.resources.InstanceResource: DEBUG
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG